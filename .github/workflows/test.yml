name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
      - android-development
  pull_request:
    branches:
      - main

jobs:


  selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
      - name: Install Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run Selenium Tests
        run: |
          mkdir -p tests/selenium/reports
          npm run test:selenium || npx jest tests/selenium/tests/ --runInBand
        continue-on-error: true
      - name: Merge per-suite reports into master 300-row report
        run: node tests/selenium/merge-reports.js
        continue-on-error: true
      - name: Upload Selenium Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: tests/selenium/reports/selenium-report.xlsx

  load-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run Load Tests
        run: |
          mkdir -p tests/load/reports
          k6 run --out json=tests/load/reports/k6-summary.json tests/load/load-test.js || true
        continue-on-error: true
      - name: Generate Load Report
        run: node tests/load/excel-reporter.js
        continue-on-error: true
      - name: Upload Load Report
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: tests/load/reports/load-report.xlsx

  appium-tests:
    runs-on: ubuntu-latest
    env:
      CI_VALIDATION_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run Appium Tests Validation
        run: |
          mkdir -p tests/appium/reports
          npm run test:appium || npx jest tests/appium/tests/ --runInBand
        continue-on-error: true
      - name: Merge per-suite reports into master 300-row report
        run: node tests/appium/merge-reports.js
        continue-on-error: true
      - name: Upload Appium Report
        uses: actions/upload-artifact@v4
        with:
          name: appium-report
          path: tests/appium/reports/appium-report.xlsx


