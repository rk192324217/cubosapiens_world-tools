<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cron Parser Tool">
    <meta name="keywords" content="Cron Parser, Cron Expression, Tool">

    <title>Cron Parser</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Cron Parser</h1>

        <p>Convert cron expressions into human readable text.</p>

        <label for="cronInput">Cron Expression</label>

        <input
            type="text"
            id="cronInput"
            placeholder="Example: */5 * * * *">

        <div class="buttons">

            <button id="parseBtn">
                Parse
            </button>

            <button id="clearBtn">
                Clear
            </button>

        </div>

        <h3>Output</h3>

        <div id="output">
            Enter a cron expression and click Parse.
        </div>

        <button id="copyBtn">
            Copy Output
        </button>

    </div>

    <script src="app.js"></script>

</body>
</html>
