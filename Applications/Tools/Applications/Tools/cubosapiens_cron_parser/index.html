<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cron Parser Tool">
    <meta name="keywords" content="cron parser, cron expression, scheduler">
    <title>Cron Parser</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>Cron Parser</h1>
        <p>Convert cron expressions into human-readable schedules.</p>
    </header>

    <section class="parser-box">

        <label for="cronInput">Cron Expression</label>

        <input
            type="text"
            id="cronInput"
            placeholder="Example: */5 * * * *"
            autocomplete="off"
        >

        <div class="buttons">
            <button id="parseBtn">Parse</button>
            <button id="clearBtn">Clear</button>
        </div>

    </section>

    <section class="result-box">

        <h2>Output</h2>

        <div id="output">
            Enter a cron expression and click Parse.
        </div>

        <button id="copyBtn">
            Copy Output
        </button>

    </section>

    <section class="examples">

        <h3>Examples</h3>

        <ul>
            <li>*/5 * * * * → Every 5 minutes</li>
            <li>0 * * * * → Every hour</li>
            <li>0 9 * * 1-5 → Weekdays at 9:00 AM</li>
            <li>0 0 * * * → Every day at midnight</li>
        </ul>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
