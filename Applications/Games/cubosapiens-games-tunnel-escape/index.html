<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tunnel Escape – Free Arcade Game | CuboSapiens</title>

    <meta name="description"
        content="Escape a collapsing tunnel! Pilot your emergency craft past falling debris, closing blast doors, and crumbling cave-ins in this atmospheric arcade browser game." />
    <link rel="canonical" href="https://cubosapiens.world/games/tunnel-escape" />

    <meta property="og:title" content="Tunnel Escape – Free Arcade Game | CuboSapiens" />
    <meta property="og:description" content="Pilot your craft to safety through a collapsing tunnel before it's too late!" />
    <meta property="og:url" content="https://cubosapiens.world/games/tunnel-escape" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Game",
      "name": "Tunnel Escape",
      "description": "Escape a collapsing tunnel — dodge falling structural debris and blast doors!",
      "url": "https://cubosapiens.world/games/tunnel-escape",
      "publisher": {
        "@type": "Organization",
        "name": "CuboSapiens",
        "url": "https://cubosapiens.world"
      },
      "genre": "Arcade",
      "playMode": "SinglePlayer"
    }
    </script>
</head>

<body>
    <main class="game-wrapper">
        <header class="site-header">
            <a href="https://cubosapiens.world" class="logo-slot" aria-label="CuboSapiens Home">
                <img src="/assets/logo.png" alt="CuboSapiens" class="logo-img" onerror="this.style.display='none'" />
                <span class="site-name">CUBO<b>SAPIENS</b></span>
            </a>

            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="https://cubosapiens.world">HOME</a> &rsaquo;
                <a href="https://cubosapiens.world/games">GAMES</a> &rsaquo; TUNNEL ESCAPE
            </nav>
        </header>

        <section class="game-container">
            <canvas id="gameCanvas" width="800" height="600" aria-label="Tunnel Escape game canvas"></canvas>

            <div id="hudOverlay" class="hud-overlay" style="display: none;">
                <div class="hud-left">
                    <span class="hud-label">SCORE</span>
                    <span id="scoreDisplay" class="hud-val">0</span>
                </div>

                <div class="hud-center">
                    <span id="distanceDisplay" class="hud-dist">0m</span>
                </div>

                <div class="hud-right">
                    <div class="hud-stat">
                        <span class="hud-label">BEST</span>
                        <span id="bestDisplay" class="hud-val">0</span>
                    </div>
                    <div class="hud-controls">
                        <button id="pauseToggleBtn" class="hud-icon-btn" aria-label="Pause Game" title="Pause (Space)">
                            <i class="fa-solid fa-pause"></i>
                        </button>
                        <button id="soundToggleBtn" class="hud-icon-btn" aria-label="Toggle Sound" title="Sound">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="startOverlay" class="game-modal-overlay">
                <div class="modal-card">
                    <h1 class="game-title">TUNNEL ESCAPE</h1>
                    <p class="game-tagline">Escape before the tunnel collapses!</p>
                    
                    <button id="playBtn" class="play-btn">
                        <i class="fa-solid fa-rocket"></i> LAUNCH CRAFT
                    </button>

                    <div class="controls-hint">
                        <span><kbd>WASD</kbd> / <kbd>Arrows</kbd> to steer</span>
                        <span class="hint-sep">•</span>
                        <span>Touch Drag on Mobile</span>
                    </div>
                </div>
            </div>

            <div id="gameOverOverlay" class="game-modal-overlay" style="display: none;">
                <div class="modal-card">
                    <h2 class="crash-title">TUNNEL COLLAPSED</h2>
                    
                    <div class="final-score-wrap">
                        <span class="score-num" id="finalScoreDisplay">0</span>
                        <span class="score-sub">ESCAPE SCORE</span>
                    </div>

                    <div class="final-meta">
                        <div class="meta-item">
                            <span>DISTANCE</span>
                            <strong id="finalDistanceDisplay">0m</strong>
                        </div>
                        <div class="meta-item">
                            <span>BEST</span>
                            <strong id="finalBestDisplay">0</strong>
                        </div>
                    </div>

                    <button id="playAgainBtn" class="play-btn">
                        <i class="fa-solid fa-rotate-right"></i> RETRY ESCAPE
                    </button>
                </div>
            </div>

            <div id="pauseOverlay" class="game-modal-overlay" style="display: none;">
                <div class="modal-card">
                    <h2 class="pause-title">PAUSED</h2>
                    <button id="resumeBtn" class="play-btn">
                        <i class="fa-solid fa-play"></i> RESUME ESCAPE
                    </button>
                </div>
            </div>
        </section>

        <footer class="site-footer">
            &copy; 2026 <a href="https://cubosapiens.world">CuboSapiens</a> · Tunnel Escape
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
