<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>Bounce Blitz – Free Retro Arcade Game | CuboSapiens</title>
  <meta name="description" content="Play Bounce Blitz free at CuboSapiens. High-speed retro action, theme support, and addictive gameplay. No download, no login."/>
  <meta name="keywords" content="ball bounce, arcade game, free bounce game, retro arcade, cubosapiens, bounce blitz"/>
  <meta name="author" content="CuboSapiens"/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://cubosapiens.world/games/ball-bounce"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://cubosapiens.world/games/ball-bounce"/>
  <meta property="og:title" content="Bounce Blitz – Free Retro Arcade | CuboSapiens"/>
  <meta property="og:description" content="High-speed retro action in Bounce Blitz. Free forever on CuboSapiens."/>
  <meta property="og:image" content="https://cubosapiens.world/games/ball-bounce/og-image.png"/>
  <meta property="og:site_name" content="CuboSapiens"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Bounce Blitz – Free Retro Arcade | CuboSapiens"/>
  <meta name="twitter:description" content="Retro bounce action. Free forever on CuboSapiens."/>
  <meta name="twitter:image" content="https://cubosapiens.world/games/ball-bounce/og-image.png"/>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Game",
      "name": "Bounce Blitz",
      "description": "Fast-paced retro ball bounce arcade game.",
      "url": "https://cubosapiens.world/games/ball-bounce",
      "publisher": {
        "@type": "Organization",
        "name": "CuboSapiens",
        "url": "https://cubosapiens.world"
      },
      "genre": "Arcade",
      "playMode": "SinglePlayer"
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
</head>
<body class="no-scrollbar">

<header class="page-header">
  <div class="logo-slot">
    <div class="site-lbl">CUBO<br>SAPIENS</div>
  </div>
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="https://cubosapiens.world">HOME</a> &rsaquo;
    <a href="https://cubosapiens.world/games">GAMES</a> &rsaquo; BOUNCE BLITZ
  </nav>
</header>

<div id="shell">
  <div id="topbar">
    <div class="sbox">
      <span class="slbl">SCORE</span>
      <span class="sval-num" id="score-display">000</span>
    </div>
    <div id="ttag"><i class="fa-solid fa-circle"></i> BLITZ<br>BOUNCE</div>
    <div class="sbox" style="text-align:right">
      <span class="slbl">BEST</span>
      <span class="sval-num" id="best-display">000</span>
    </div>
  </div>

  <div id="screen-splash" class="screen active">
    <div class="game-card">
      <div class="title"><i class="fa-solid fa-circle"></i> BOUNCE BLITZ</div>
      <div class="subtitle">RETRO ARCADE CHALLENGE</div>
      <div class="instruction-text">Use &larr; &rarr; or drag to move the paddle</div>
      <button class="btn btn-primary" id="btn-splash-start"><i class="fa-solid fa-play"></i> START GAME</button>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div id="hud">
      <span>LIVES <span id="lives-val">3</span></span>
      <button id="pause-btn" title="Pause (Esc)"><i class="fa-solid fa-pause"></i> PAUSE</button>
      <button id="theme-toggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
    </div>

    <div id="scrwrap">
      <canvas id="gameCanvas" width="400" height="500"></canvas>
      <div id="overlay" class="hidden">
        <div id="ovt">PAUSED</div>
        <div id="ovm">Press ESC or Click Start</div>
        <button id="resume-btn" class="btn btn-primary">RESUME</button>
      </div>
      <div id="game-over-overlay" class="hidden">
        <div id="ovt" class="title over">GAME OVER</div>
        <div id="ovsc">Final Score: <span id="final-score">0</span></div>
        <div id="hi-msg" class="hidden" style="color:var(--s1); font-size:6px; margin-bottom:10px;">NEW HIGH SCORE!</div>
        <button id="restart-btn" class="btn btn-primary">RESTART</button>
      </div>
    </div>

    <div id="dpad">
      <div id="dpad-mid-row">
        <button class="db lt" id="btn-left" aria-label="Move Left"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="dpad-gap"></div>
        <button class="db rt" id="btn-right" aria-label="Move Right"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>
  </div>
</div>

<div id="custom-cursor"></div>
<div id="aria-announcer" class="visually-hidden" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
