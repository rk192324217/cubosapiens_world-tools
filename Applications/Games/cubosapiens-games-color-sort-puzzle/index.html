<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Color Sort Puzzle Sort the tubes, clear the lab</title>
    <meta name="description"
        content="Color Sort Puzzle: a fast, satisfying browser puzzle game. Pour colors between tubes until every tube holds a single color. Free, no install, works offline.">
    <meta name="theme-color" content="#12141c">


    <meta property="og:type" content="website">
    <meta property="og:title" content="Color Sort Puzzle">
    <meta property="og:description"
        content="Sort the tubes, clear the lab. A quick, satisfying color-sorting puzzle you can play in your browser.">
    <meta property="og:image" content="assets/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/logo.png">
</head>

<body data-theme="dark">

    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <img src="assets/logo.png" alt="" width="40" height="40">
            </span>
            <h1>Color&nbsp;Sort<span class="brand-sub">PUZZLE</span></h1>
        </div>

        <div class="stat-cluster" role="group" aria-label="Game stats">
            <div class="stat">
                <span class="stat-label">Level</span>
                <span class="stat-value" id="level-value">1</span>
            </div>
            <div class="stat">
                <span class="stat-label">Moves</span>
                <span class="stat-value" id="moves-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Best</span>
                <span class="stat-value" id="best-value">—</span>
            </div>
        </div>

        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to light mode" aria-pressed="false">
            <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.5 5.5 0 0 1 12 3Z" fill="currentColor" />
            </svg>
        </button>
    </header>

    <main class="stage">
        <p class="hint" id="game-hint">Tap a tube to pick it up, tap another to pour. Match colors to clear the lab.</p>

        <div class="difficulty-bar" id="difficulty-bar" role="group" aria-label="Difficulty">
            <button class="difficulty-btn" type="button" data-difficulty="easy">Easy</button>
            <button class="difficulty-btn" type="button" data-difficulty="medium">Medium</button>
            <button class="difficulty-btn" type="button" data-difficulty="hard">Hard</button>
        </div>

        <div class="tube-rack-card">
            <div class="tube-rack" id="tube-rack" role="group" aria-label="Puzzle tubes"></div>
        </div>
    </main>

    <div class="celebration-overlay" id="celebration-overlay" hidden>
        <canvas id="confetti-canvas"></canvas>
        <div class="celebration-content">
            <h2>Level cleared! 🎉</h2>
            <p id="celebration-moves"></p>
            <button id="skip-celebration" class="btn primary" type="button">Next level now →</button>
        </div>
    </div>

    <footer class="controls">
        <button id="undo-btn" class="btn" type="button">Undo</button>
        <button id="restart-btn" class="btn" type="button">Restart level</button>
        <button id="new-level-btn" class="btn" type="button">Shuffle new</button>
    </footer>

    <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>

</html>
